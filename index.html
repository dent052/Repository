<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SG 合格トレーナー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 答案用紙の青インクと採点の朱を軸にした、一列の学習ノート */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #1d2433; --muted: #5d6677; --line: #d9dee7;
  --accent: #1f4fa3; --accent-soft: #e6edf9; --ok: #1d7a4c; --ok-soft: #e3f3ea; --ng: #c0392b; --ng-soft: #fbe9e7;
  --tip: #fff6dc; --tip-line: #e2c25a;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-display: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f; --surface: #1a202c; --ink: #e5e9f0; --muted: #9aa4b5; --line: #2e3646;
    --accent: #7da6f0; --accent-soft: #22304a; --ok: #5cc48c; --ok-soft: #173326; --ng: #f08072; --ng-soft: #3a1f1c;
    --tip: #2f2a17; --tip-line: #8a7631; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f; --surface: #1a202c; --ink: #e5e9f0; --muted: #9aa4b5; --line: #2e3646;
  --accent: #7da6f0; --accent-soft: #22304a; --ok: #5cc48c; --ok-soft: #173326; --ng: #f08072; --ng-soft: #3a1f1c;
  --tip: #2f2a17; --tip-line: #8a7631; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.8 var(--f-body); }
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 24px; }
h1, h2 { font-family: var(--f-display); line-height: 1.4; margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; margin: 1.6em 0 .4em; padding-bottom: .2em; border-bottom: 1px solid var(--line); }
p { margin: .5em 0; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: .55em 1em; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); font-size: .9rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .8rem; letter-spacing: .08em; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.back { background: none; border: none; color: var(--accent); padding: 0; justify-self: start; text-align: left; }
.choice:disabled { opacity: 1; cursor: default; }

/* ホーム */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat b { display: block; font-family: var(--f-num); font-size: 1.5rem; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; }
.chapters li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.chapters li:last-child { border-bottom: none; }
.chapters .back { width: 100%; min-height: 44px; padding: .4em 0; font-size: 1rem; }
.chapters .no { font-family: var(--f-num); color: var(--muted); }
.pill { font-size: .75rem; padding: .1em .7em; border-radius: 999px; white-space: nowrap; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.open { background: var(--accent-soft); color: var(--accent); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mode { text-align: left; display: grid; gap: 4px; padding: 14px 16px; }
.mode b { font-size: 1rem; }

/* テキスト */
.text table, .scenario table, .qtext table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: .5em 0; }
.tablewrap { overflow-x: auto; }
.text th, .text td, .scenario th, .scenario td, .qtext th, .qtext td { border: 1px solid var(--line); padding: .45em .6em; text-align: left; vertical-align: top; }
.text th, .scenario th, .qtext th { background: var(--accent-soft); }
.tip { background: var(--tip); border-left: 4px solid var(--tip-line); padding: .7em 1em; border-radius: 4px; }
.goal { background: var(--accent-soft); padding: .7em 1em; border-radius: 8px; }
blockquote { margin: .5em 0; padding: .6em 1em; border-left: 3px solid var(--line); background: var(--bg); }

/* 問題 */
.scenario { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
.choices { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.choice { width: 100%; text-align: left; display: grid; grid-template-columns: 2em 1fr; gap: 8px; align-items: start; padding: .7em .9em; }
.choice .lab { font-weight: 700; color: var(--accent); }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--ng); background: var(--ng-soft); }
.verdict { font-weight: 700; font-size: 1.1rem; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--ng); }
.explain { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 12px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.6em, 1fr)); gap: 6px; }
.grid button { padding: .3em 0; font-family: var(--f-num); font-size: .85rem; }
.grid button.ans { background: var(--accent-soft); border-color: var(--accent); }
.grid button.cur { outline: 2px solid var(--ink); }
.timer { font-family: var(--f-num); font-size: 1.1rem; }
.confirm { background: var(--ng-soft); border: 1px solid var(--ng); border-radius: 8px; padding: 12px; }
.score { font-family: var(--f-num); font-size: 2.6rem; line-height: 1.2; }
table.result { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.result td, table.result th { padding: .4em .5em; border-bottom: 1px solid var(--line); text-align: left; }
table.result td.r { text-align: right; font-family: var(--f-num); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s; } }
</style>
</head>
<body>
<main id="app"><p class="muted">読み込み中…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
