<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SG 合格トレーナー</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c4dff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* 丸くて明るい、毎日開きたくなるポップな学習ノート */
:root {
  --bg: #fff7ec; --dot: #f6e6cf; --surface: #ffffff; --ink: #2b2140; --muted: #786d8a; --line: #eedfcb; --edge: #e2cfb6;
  --accent: #7c4dff; --accent-edge: #5629d9; --accent-soft: #efe8ff; --pink: #ff5c8a; --yellow: #ffcf3f; --flame: #ff8a00;
  --ok: #16a37f; --ok-soft: #dcf7ee; --ok-edge: #0f7e62; --ng: #ef4b55; --ng-soft: #ffe5e6;
  --tip: #fff3c4; --tip-line: #ffcf3f;
  --f-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1530; --dot: #241c3d; --surface: #261e40; --ink: #f4efff; --muted: #b4a8cf; --line: #3a2f5c; --edge: #15102a;
    --accent: #a98bff; --accent-edge: #6c48e8; --accent-soft: #33295a; --pink: #ff7aa2; --yellow: #ffd95e; --flame: #ffa53d;
    --ok: #4fe0b9; --ok-soft: #173d36; --ok-edge: #1c8f72; --ng: #ff7d81; --ng-soft: #4a2230;
    --tip: #3a3220; --tip-line: #c9a62c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1530; --dot: #241c3d; --surface: #261e40; --ink: #f4efff; --muted: #b4a8cf; --line: #3a2f5c; --edge: #15102a;
  --accent: #a98bff; --accent-edge: #6c48e8; --accent-soft: #33295a; --pink: #ff7aa2; --yellow: #ffd95e; --flame: #ffa53d;
  --ok: #4fe0b9; --ok-soft: #173d36; --ok-edge: #1c8f72; --ng: #ff7d81; --ng-soft: #4a2230;
  --tip: #3a3220; --tip-line: #c9a62c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font: 16px/1.8 var(--f-body);
  background: var(--bg) radial-gradient(var(--dot) 1.5px, transparent 1.6px) 0 0 / 22px 22px; }
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: grid; gap: 18px; }
h1, h2 { line-height: 1.35; margin: 0; font-weight: 800; text-wrap: balance; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; margin-bottom: .3em; }
h3 { font-size: 1.05rem; margin: 1.6em 0 .5em; padding: .2em .7em; border-radius: 10px; background: var(--accent-soft); color: var(--accent-edge); }
:root[data-theme="dark"] h3 { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h3 { color: var(--accent); } }
p { margin: .5em 0; }
a { color: var(--accent); }
b { font-weight: 800; }

/* ボタン: ぷっくりした押せる形 */
button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  padding: .6em 1.1em; box-shadow: 0 4px 0 var(--edge); transition: transform .08s, box-shadow .08s; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-edge); }
button.primary:active { box-shadow: 0 1px 0 var(--accent-edge); }
button:disabled { opacity: .45; cursor: not-allowed; }
.back { background: none; border: none; box-shadow: none; color: var(--accent); padding: 0; justify-self: start; text-align: left; }
.back:active:not(:disabled) { transform: none; box-shadow: none; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .8rem; font-weight: 700; color: var(--muted); }
.label { font-size: .85rem; font-weight: 800; color: var(--accent); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 18px 20px; min-width: 0; box-shadow: 0 6px 0 var(--line); }
.badge { font-size: .75rem; font-weight: 800; padding: .15em .8em; border-radius: 999px; background: var(--ok); color: #fff; white-space: nowrap; }

/* ホーム: ヘッダーと連続日数 */
.hero-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hero-head h1 { background: linear-gradient(90deg, var(--accent), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.streak { display: grid; justify-items: center; line-height: 1.1; padding: 8px 14px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); filter: grayscale(1); opacity: .8; }
.streak.on { filter: none; opacity: 1; border-color: var(--flame); box-shadow: 0 4px 0 var(--flame); }
.streak .flame { font-size: 1.4rem; }
.streak b { font-size: 1.4rem; color: var(--flame); }
.streak small { font-size: .7rem; font-weight: 700; color: var(--muted); }

/* 合格予測メーター */
.meter-card { background: linear-gradient(135deg, var(--accent-soft), var(--surface) 70%); }
.big { font-size: 1rem; font-weight: 700; color: var(--muted); }
.big b { font-size: 3rem; line-height: 1.1; color: var(--ink); }
.meter { position: relative; height: 18px; border-radius: 999px; background: var(--line); margin: 6px 0 4px; }
.meter i { position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--yellow)); }
.meter .line { position: absolute; left: 60%; top: -5px; bottom: -5px; width: 3px; border-radius: 2px; background: var(--ink); }
.meter .line::after { content: "合格600"; position: absolute; top: -1.6em; left: 50%; transform: translateX(-50%); font-size: .7rem; font-weight: 800; white-space: nowrap; }
.meter-card .meter { margin-top: 22px; }
.meter-msg { margin: .3em 0 .6em; }
.chip { font-size: .9rem; padding: .45em .9em; border-radius: 999px; border-color: var(--accent); color: var(--accent); box-shadow: 0 3px 0 var(--accent); text-align: left; }

/* 今日の復習 */
.cta { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 14px 18px;
  background: linear-gradient(135deg, var(--accent), var(--pink)); border: none; color: #fff; border-radius: 18px; box-shadow: 0 5px 0 var(--accent-edge); }
.cta:active:not(:disabled) { box-shadow: 0 2px 0 var(--accent-edge); }
.cta-emoji { font-size: 2rem; }
.cta-text { display: grid; line-height: 1.4; }
.cta b { font-size: 1.2rem; }
.cta .go { font-weight: 800; background: #fff; color: var(--accent-edge); padding: .3em .8em; border-radius: 999px; }
.done-msg { display: flex; gap: 14px; align-items: center; }
.done-msg > div { display: grid; line-height: 1.5; }
.plan { margin: .4em 0 0; }
.plan b { color: var(--accent); }
input[type="date"] { font: inherit; font-weight: 700; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: .3em .6em; }

/* 章一覧 */
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ch { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 14px; }
.ch-icon { font-size: 1.6rem; width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); }
.ch-body { display: grid; gap: 4px; }
.ch-title { line-height: 1.4; }
.mini { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.mini i { display: block; height: 100%; width: var(--w); border-radius: 999px; background: linear-gradient(90deg, var(--ok), var(--yellow)); }

/* 演習 */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mode { text-align: left; display: grid; gap: 2px; padding: 14px 16px; }
.mode.mock { background: var(--yellow); border-color: var(--yellow); color: #3a2a00; box-shadow: 0 4px 0 #d9a400; }
.mode-emoji { font-size: 1.8rem; }
.mode small { font-weight: 400; font-size: .85rem; }
.fields { display: flex; flex-wrap: wrap; gap: 8px; }
.fields button { font-size: .9rem; padding: .45em .9em; border-radius: 999px; }

/* テキスト */
.text table, .scenario table, .qtext table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: .5em 0; }
.tablewrap { overflow-x: auto; }
.text th, .text td, .scenario th, .scenario td, .qtext th, .qtext td { border: 2px solid var(--line); padding: .45em .6em; text-align: left; vertical-align: top; }
.text th, .scenario th, .qtext th { background: var(--accent-soft); }
.tip { background: var(--tip); border: 2px dashed var(--tip-line); padding: .7em 1em; border-radius: 14px; }
.tip::before { content: "💡 "; }
.goal { background: var(--accent-soft); padding: .7em 1em; border-radius: 14px; }
blockquote { margin: .5em 0; padding: .6em 1em; border-left: 4px solid var(--line); background: var(--bg); border-radius: 8px; }

/* 問題 */
.qcard { display: grid; gap: 6px; }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 4px 0 10px; }
.bar i { display: block; height: 100%; width: var(--w); border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); }
.scenario { background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; }
.qtext { font-weight: 700; }
.choices { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.choice { position: relative; width: 100%; text-align: left; display: grid; grid-template-columns: 2em 1fr; gap: 8px; align-items: start; padding: .75em .9em; font-weight: 400; }
.choice:disabled { opacity: 1; cursor: default; }
.choice .lab { display: grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 4px 0 var(--ok-edge); }
.choice.correct .lab { background: var(--ok); color: #fff; }
.choice.wrong { border-color: var(--ng); background: var(--ng-soft); box-shadow: 0 4px 0 var(--ng); }
.choice.wrong .lab { background: var(--ng); color: #fff; }
.verdict { font-weight: 800; font-size: 1.2rem; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--ng); }
.explain { margin-top: 14px; border-radius: 16px; padding: 12px 16px; background: var(--bg); border: 2px solid var(--line); }
.explain.ok { border-color: var(--ok); }
.explain.ng { border-color: var(--ng); }
.next { font-size: 1.05rem; padding: .7em 1.6em; }
.combo { font-weight: 800; color: #fff; background: var(--flame); padding: .2em .9em; border-radius: 999px; box-shadow: 0 3px 0 #c76a00; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.7em, 1fr)); gap: 6px; margin-top: 8px; }
.grid button { padding: .3em 0; font-size: .85rem; border-radius: 10px; box-shadow: 0 2px 0 var(--edge); }
.grid button.ans { background: var(--accent-soft); border-color: var(--accent); }
.grid button.cur { outline: 3px solid var(--pink); }
.timer { font-weight: 800; font-size: 1.1rem; }
.confirm { margin-top: 12px; background: var(--ng-soft); border: 2px solid var(--ng); border-radius: 14px; padding: 12px; }

/* 結果 */
.result-card { text-align: center; }
.result-emoji { font-size: 3.5rem; line-height: 1.2; }
.score { font-size: 2.8rem; font-weight: 800; line-height: 1.2; }
.score small { font-size: 1rem; }
table.result { border-collapse: collapse; width: 100%; font-size: .92rem; text-align: left; }
table.result td, table.result th { padding: .4em .5em; border-bottom: 2px solid var(--line); text-align: left; }
table.result td.r { text-align: right; }
details { border-top: 2px solid var(--line); padding: 8px 0; }
summary { cursor: pointer; }

/* 正解の紙吹雪 */
.burst { position: absolute; left: 50%; top: 50%; pointer-events: none; }
.burst i { position: absolute; font-style: normal; font-size: 1.2rem; transform: translate(-50%, -50%); opacity: 0; }

/* アニメーション（動きを減らす設定では止める） */
@media (prefers-reduced-motion: no-preference) {
  .pop-in { animation: pop-in .45s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: var(--d, 0s); }
  .meter i, .mini i { animation: grow 1s cubic-bezier(.2, .9, .3, 1) both; }
  .bar i { transition: width .3s; }
  .streak.on .flame { display: inline-block; animation: flicker 1.6s ease-in-out infinite; }
  .cta .go { animation: pulse 1.4s ease-in-out infinite; }
  .choice.correct { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .choice.wrong { animation: shake .4s; }
  .explain { animation: slide-up .35s ease-out both; }
  .combo { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .result-emoji { animation: bounce 1s cubic-bezier(.2, 1.6, .4, 1) both; }
  .burst i { animation: fly .8s ease-out forwards; }
}
@keyframes pop-in { from { opacity: 0; transform: scale(.92) translateY(8px); } }
@keyframes grow { from { width: 0; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes slide-up { from { opacity: 0; transform: translateY(10px); } }
@keyframes bounce { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.2) rotate(8deg); } 100% { transform: scale(1); } }
@keyframes pulse { 50% { transform: scale(1.1); } }
@keyframes flicker { 50% { transform: scale(1.15) rotate(-6deg); } }
@keyframes fly {
  0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--a)) translateY(0) rotate(calc(-1 * var(--a))); }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) translateY(-70px) rotate(calc(-1 * var(--a))) scale(1.3); }
}
</style>
</head>
<body>
<main id="app"><p class="muted">読み込み中…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
