<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SG 合格トレーナー</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBFBF9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 落ち着いた紙の白に、操作の青緑と正誤の緑・赤だけ。会話は丸ゴシック、問題は本番に近い角ゴシック */
:root {
  --paper: #FBFBF9; --surface: #FFFFFF; --bubble: #F1F2EE; --ink: #2E333D; --sub: #6B7178; --line: #E6E5E0;
  --act: #0F6E6E; --act-edge: #0A4F4F; --act-soft: #E3F0EF;
  --ok: #2E9E5B; --ok-edge: #237A46; --ok-soft: #E4F4EA; --ng: #D64545; --ng-edge: #A83434; --ng-soft: #FBE7E7;
  --marker: #FFE28A; --note: #FFF3C4; --gold: #FFD66B; --blush: #FF9EAA; --steel: #B9C2CC;
  --shibata: #3557C7; --okamoto: #C2477A; --miura: #138A72; --takagi: #B5651D;
  --talk: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --exam: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1C1F24; --surface: #24282E; --bubble: #2C3138; --ink: #ECEDEA; --sub: #A3A9B0; --line: #3A3F47;
    --act: #3FB3B0; --act-edge: #2A8582; --act-soft: #1F3B3B;
    --ok: #4CC27E; --ok-edge: #2F8A55; --ok-soft: #1E3A2A; --ng: #EF6B6B; --ng-edge: #B54848; --ng-soft: #42262A;
    --marker: #8A6D1A; --note: #3A3320; --steel: #8A949F;
    --shibata: #8EA8FF; --okamoto: #F28BB4; --miura: #4FD1B5; --takagi: #E8A25E;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.8 var(--talk); }
#app { max-width: 520px; margin: 0 auto; padding: 0 16px 140px; }
h1, h2, p { margin: 0; }
h1 { font-size: 24px; line-height: 1.45; }
h2 { font-size: 17px; line-height: 1.5; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--act); outline-offset: 2px; }
.sub { color: var(--sub); font-size: 13px; line-height: 1.7; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.num { font-variant-numeric: tabular-nums; }
mark { background: linear-gradient(transparent 58%, var(--marker) 58%); color: inherit; font-weight: 700; }

/* 押すボタン: 下端に幅いっぱい、立体の縁取り */
.go { display: block; width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--act); color: #fff;
  box-shadow: 0 4px 0 var(--act-edge); font-size: 17px; font-weight: 700; padding: 10px 16px; }
.go:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--act-edge); }
.go:disabled { opacity: .35; cursor: default; }
.go.quiet { background: var(--surface); color: var(--act); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.go.small { width: auto; min-height: 44px; font-size: 14px; flex: none; }
.row .go { flex: 1; }

/* ホーム */
.home-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 8px; }
.home-head h1 { font-size: 20px; }
.streak { font-size: 13px; font-weight: 700; color: var(--sub); border: 2px solid var(--line); border-radius: 999px; padding: 2px 12px; }
.streak.on { color: var(--act); border-color: var(--act); }
.next { position: relative; padding: 18px 0 22px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.home-kagi { position: absolute; right: 0; top: 4px; width: 84px; height: 84px; }
.ep-no { font-size: 14px; font-weight: 700; color: var(--act); }
.ep-title { font-size: 26px; line-height: 1.4; padding-right: 90px; }
.block { padding: 20px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.score-line { font-size: 15px; color: var(--sub); }
.score-line b { font-size: 36px; color: var(--ink); }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--line); }
.meter i { position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: 5px; background: var(--ok); }
.meter .pass { position: absolute; left: 60%; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
input[type="date"] { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 2px 8px; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.hooks { margin: 8px 0 0; padding-left: 1.1em; display: grid; gap: 10px; font-size: 15px; line-height: 1.75; }
.hooks b { display: block; }
.records { width: 100%; border-collapse: collapse; font-size: 14px; }
.records th, .records td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.records .r { text-align: right; font-variant-numeric: tabular-nums; }
.note { color: var(--sub); font-size: 12px; line-height: 1.7; padding: 20px 0; }

/* 上: 中断・進み具合・連続・XP */
.top { position: sticky; top: 0; z-index: 3; background: var(--paper); display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.quit { border: 0; background: none; color: var(--sub); font-size: 20px; width: 32px; height: 32px; padding: 0; flex: none; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--act); transition: width .35s ease-out; }
.xp { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 58px; text-align: right; }
.chain { font-size: 12px; font-weight: 700; color: #7A5C00; background: var(--note); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.timer { font-weight: 700; font-variant-numeric: tabular-nums; }

/* 場面（会話） */
.scene { padding: 4px 0 20px; }
.scene h1 { margin: 2px 0 16px; }
.line { margin: 0 0 12px; }
.narr { color: var(--sub); font-size: 15px; line-height: 1.85; margin: 16px 2px; }
.name { font-size: 12px; font-weight: 700; margin: 0 0 3px 4px; }
.name.shibata { color: var(--shibata); } .name.okamoto { color: var(--okamoto); } .name.miura { color: var(--miura); } .name.takagi { color: var(--takagi); }
.say { display: inline-block; max-width: 94%; background: var(--bubble); border-radius: 4px 18px 18px 18px; padding: 10px 14px; font-size: 17px; line-height: 1.8; }
.lit .say { box-shadow: 0 0 0 3px var(--gold); }

/* 問題: 本番どおりの書体と形 */
.exam { padding: 4px 0 20px; font-family: var(--exam); }
.exam.revealed { padding-bottom: 62vh; } /* 判定の欄が出ても、選択肢までスクロールして戻れるように */
.qhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; min-height: 64px; }
.qhead .kagi { width: 64px; height: 64px; }
.tag { display: inline-block; margin-right: 6px; color: #fff; background: var(--act); border-radius: 999px; padding: 0 8px; font-weight: 700; }
.ask { font-size: 18px; font-weight: 700; line-height: 1.7; margin: 6px 0 16px; font-family: var(--exam); }
.scenario { font-size: 15px; line-height: 1.85; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 6px; }
.tablewrap { overflow-x: auto; }
.scenario table, .ask table { border-collapse: collapse; font-size: 14px; margin: .5em 0; }
.scenario th, .scenario td, .ask th, .ask td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.choice { width: 100%; text-align: left; display: grid; grid-template-columns: 24px 1fr; gap: 6px; font-family: var(--exam); font-size: 15px; line-height: 1.65;
  background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; padding: 11px 12px; }
.choice.picked { border-color: var(--act); background: var(--act-soft); }
.choice.ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.ng { border-color: var(--ng); background: var(--ng-soft); }
.choice:disabled { cursor: default; color: var(--ink); }
.hint { margin-top: 14px; border: 0; background: none; color: var(--act); font-weight: 700; font-size: 14px; padding: 6px 0; font-family: var(--talk); }
.hintbox { margin-top: 10px; font-family: var(--talk); }
.hintbox .sub { margin-bottom: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.6em, 1fr)); gap: 6px; margin: 16px 0 6px; }
.grid button { border: 2px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 0; font-size: 13px; }
.grid .ans { border-color: var(--act); background: var(--act-soft); }
.grid .cur { box-shadow: 0 0 0 2px var(--ink); }
.confirm { margin-top: 12px; border: 2px solid var(--ng); background: var(--ng-soft); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }

/* 下: ボタンと判定の欄 */
.foot { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; }
.foot > div { max-width: 520px; margin: 0 auto; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--line); display: grid; gap: 10px; }
.foot.ok > div { background: var(--ok-soft); border-color: transparent; }
.foot.ng > div { background: var(--ng-soft); border-color: transparent; }
.foot.ok .go { background: var(--ok); box-shadow: 0 4px 0 var(--ok-edge); }
.foot.ng .go { background: var(--ng); box-shadow: 0 4px 0 var(--ng-edge); }
.foot .go.quiet { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.verdict { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: center; }
.verdict .kagi { width: 56px; height: 56px; }
.verdict b { font-size: 21px; display: block; }
.ok .verdict b { color: var(--ok); }
.ng .verdict b { color: var(--ng); }
.verdict small { font-size: 13px; font-weight: 700; }
.explain { font-family: var(--exam); font-size: 14px; line-height: 1.8; max-height: 34vh; overflow-y: auto; display: grid; gap: 8px; }
.hook { background: var(--note); border-radius: 10px; padding: 8px 10px; font-family: var(--talk); font-weight: 700; }
.hook b { display: block; font-size: 12px; color: var(--sub); }
.retry { font-weight: 700; color: var(--act); font-family: var(--talk); }
.fly { position: fixed; z-index: 9; font-weight: 700; font-size: 20px; color: var(--ok); pointer-events: none; }

/* 略語の組み立て */
.game { padding: 4px 0 20px; display: grid; gap: 10px; }
.slots { display: flex; gap: 8px; margin: 8px 0; }
.slot { flex: 1; min-width: 0; border: 2px dashed var(--line); border-radius: 12px; min-height: 84px; padding: 8px 2px; text-align: center; font-family: var(--exam); }
.slot .letter { margin: 0 auto 6px; width: 38px; height: 38px; font-size: 20px; background: var(--line); color: var(--ink); }
.slot.now { border-color: var(--act); }
.slot.now .letter { background: var(--act); color: #fff; }
.slot.done { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.slot.done .letter { background: var(--ok); color: #fff; }
.slot .w { display: block; font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; }
.picks { display: grid; gap: 10px; }
.pick { min-height: 56px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: var(--surface); font-family: var(--exam); font-size: 18px; font-weight: 700; }
.gist { background: var(--note); border-radius: 12px; padding: 10px 12px; font-weight: 700; line-height: 1.75; }

/* 用語と略語の説明（画面下） */
button.term { display: inline; font: inherit; color: inherit; padding: 0; margin: 0; border: 0; border-bottom: 2px dotted var(--act); border-radius: 0; background: none; cursor: help; }
.sheet { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--surface);
  border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .14); padding: 16px 20px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
.sheet[hidden] { display: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head b { font-size: 22px; }
.sheet-close { border: 0; background: var(--bubble); border-radius: 999px; width: 32px; height: 32px; }
.sheet .en { color: var(--sub); }
.parts { display: grid; gap: 8px; }
.part { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 10px; }
.letter { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--act); color: #fff; font: 700 22px/1 var(--exam); }
.word { font-family: var(--exam); font-size: 16px; line-height: 1.4; }
.word b { color: var(--act); font-size: 18px; }
.word small { display: block; color: var(--sub); font-family: var(--talk); font-size: 13px; }

/* 結果 */
.result { padding: 24px 0 12px; display: grid; gap: 12px; text-align: center; }
.result .ending, .result .learned { text-align: left; }
.ending { font-size: 16px; line-height: 1.9; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats div { padding: 12px 0; display: grid; }
.stats div + div { border-left: 1px solid var(--line); }
.stats span { font-size: 12px; color: var(--sub); font-weight: 700; }
.stats b { font-size: 28px; font-variant-numeric: tabular-nums; }

/* カギ */
.kagi { overflow: visible; display: block; }
.kagi.big { width: 132px; height: 132px; margin: 0 auto; }
.k-shadow { fill: #000; opacity: .08; }
.k-shackle { fill: none; stroke: var(--steel); stroke-width: 11; stroke-linecap: round; }
.k-body { fill: var(--gold); stroke: #2E333D; stroke-width: 3.5; }
.k-shine { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; opacity: .7; }
.k-ink { fill: #2E333D; }
.k-line { stroke: #2E333D; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.k-cheek { fill: var(--blush); opacity: .85; }
.k-sparkle { fill: #FFC94D; transform-box: fill-box; transform-origin: center; }
.k-drop { fill: #8EC5FF; }
.k-ng .k-shackle { transform: translate(14px, -14px) rotate(22deg); transform-origin: 82px 52px; }
@media (prefers-reduced-motion: no-preference) {
  .k-idle { transform-origin: 60px 112px; animation: k-breathe 2.6s ease-in-out infinite; }
  .k-blink { transform-box: fill-box; transform-origin: center; animation: k-blink 3.6s infinite; }
  .k-ok { transform-origin: 60px 112px; animation: k-jump .7s cubic-bezier(.3,.7,.4,1); }
  .k-ok .k-shackle { animation: k-close .45s cubic-bezier(.3,.7,.4,1); }
  .k-ng { transform-origin: 60px 100px; animation: k-shake .6s ease-in-out; }
  .k-hint { animation: k-hop 1.4s ease-in-out infinite; }
  .k-sparkle { animation: k-sparkle .9s ease-out both; }
  .k-late { animation-delay: .15s; }
  .k-drop { animation: k-drop 1.2s ease-in infinite; }
}
@keyframes k-breathe { 50% { transform: scale(1.03, .97); } }
@keyframes k-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@keyframes k-jump { 0% { transform: scale(1.12, .86); } 35% { transform: translateY(-18px) scale(.94, 1.08); } 65% { transform: scale(1.08, .92); } 100% { transform: none; } }
@keyframes k-close { 0% { transform: translateY(-12px); } 60% { transform: translateY(2px); } 100% { transform: none; } }
@keyframes k-shake { 15% { transform: rotate(-8deg); } 35% { transform: rotate(7deg); } 55% { transform: rotate(-4deg); } 75% { transform: rotate(2deg); } }
@keyframes k-hop { 50% { transform: translateY(-4px); } }
@keyframes k-sparkle { 0% { transform: scale(0); opacity: 1; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
@keyframes k-drop { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main id="app"><p class="sub">読み込み中…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
